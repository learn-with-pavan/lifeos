<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="8" y1="8" x2="56" y2="56" gradientUnits="userSpaceOnUse">
      <stop stop-color="#111827"/>
      <stop offset="1" stop-color="#020617"/>
    </linearGradient>

    <linearGradient id="core" x1="18" y1="14" x2="49" y2="52" gradientUnits="userSpaceOnUse">
      <stop stop-color="#60A5FA"/>
      <stop offset="0.5" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>

    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- App background -->
  <rect width="64" height="64" rx="16" fill="url(#bg)"/>

  <!-- Life orbit -->
  <circle
    cx="32"
    cy="32"
    r="20"
    stroke="url(#core)"
    stroke-width="2"
    stroke-opacity="0.35"
  />

  <!-- Connection nodes -->
  <circle cx="32" cy="12" r="3" fill="#60A5FA"/>
  <circle cx="51" cy="32" r="3" fill="#A78BFA"/>
  <circle cx="32" cy="52" r="3" fill="#38BDF8"/>
  <circle cx="13" cy="32" r="3" fill="#818CF8"/>

  <!-- Core -->
  <circle
    cx="32"
    cy="32"
    r="13"
    fill="#0F172A"
    stroke="url(#core)"
    stroke-width="2"
    filter="url(#glow)"
  />

  <!-- L -->
  <path
    d="M26 21V40C26 43.3 28.7 46 32 46H39"
    stroke="url(#core)"
    stroke-width="5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Core point -->
  <circle cx="32" cy="32" r="3" fill="white"/>
</svg>